[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "claim-gate"
version = "0.1.1"
description = "Block hallucinated facts before they ship: every claim in a CSV, JSON or JSONL list needs a source URL, an exact quote and a fresh check date."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ravi Shanker Chaturvedi" }]
keywords = ["fact-checking", "hallucination", "llm", "ai-agents", "guardrails", "grounding", "claim-verification", "evidence", "data-quality", "sales-intelligence", "lead-generation", "csv", "jsonl", "cli", "python"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Office/Business",
]
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://github.com/Ravishankerchaturvedi/claim-gate"
Issues = "https://github.com/Ravishankerchaturvedi/claim-gate/issues"
Changelog = "https://github.com/Ravishankerchaturvedi/claim-gate/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
claim-gate = "claim_gate.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["claim_gate*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
